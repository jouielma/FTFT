<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FTFT 15x15 턴제 1vs1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--board-size:min(94vw,calc(100dvh - 302px),560px)}
html,body{width:100%;height:100%;margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;overflow:hidden}
button{touch-action:manipulation}
#app{height:100dvh;width:100%;max-width:620px;margin:auto;padding:max(4px,env(safe-area-inset-top)) 5px max(4px,env(safe-area-inset-bottom));display:grid;grid-template-rows:30px 82px var(--board-size) 1fr;gap:4px;position:relative;overflow:hidden}
h2{font-size:16px;text-align:center;margin:0;line-height:30px;white-space:nowrap}
#phase{position:absolute;z-index:25;left:50%;top:112px;transform:translate(-50%,-50%);pointer-events:none}
.turn{display:block;background:#101010d9;border:1px solid #777;border-radius:999px;padding:5px 12px;text-align:center;font-size:12px;font-weight:800;box-shadow:0 2px 8px #000;white-space:nowrap}
#opponent-hud,#player-hud{min-height:0}
#board{
  --cell-size:calc((var(--board-size) - 4px) / 15);
  width:var(--board-size);height:var(--board-size);margin:auto;position:relative;display:block;flex:none;background:#555;overflow:hidden;border:2px solid #777;border-radius:4px;box-shadow:0 4px 18px #0008
}
.cell{
  position:absolute;
  width:var(--cell-size);
  height:var(--cell-size);
  left:calc(var(--x) * var(--cell-size));
  top:calc(var(--y) * var(--cell-size));
  margin:0;
  padding:0;
  background:#292929;
  border:1px solid #555;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.cell.move{background:#344d36}.cell.attack{background:#5a3434}.cell.skill{background:#45405d}
.unit{
  width:72%;
  height:72%;
  min-width:72%;
  min-height:72%;
  max-width:72%;
  max-height:72%;
  aspect-ratio:1;
  border-radius:50%;
  border:2px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:clamp(8px,2.7vw,15px);
  flex:none;
}
.warrior{background:#b64a35}.assassin{background:#3973b8}
.mine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(7px,2vw,12px);line-height:1;text-align:center}
.hud{height:100%;background:linear-gradient(180deg,#292929,#202020);border:1px solid #494949;border-radius:9px;padding:6px 8px;display:grid;grid-template-columns:minmax(82px,.8fr) 1.8fr minmax(112px,1fr);gap:8px;align-items:center;box-shadow:0 2px 8px #0006}
.hud.current{border-color:#e6c75d;box-shadow:0 0 8px #e6c75d55}
.hud-title{font-size:15px;font-weight:900}.hud-sub{font-size:10px;color:#bbb;margin-top:3px}.hud-bars{display:grid;gap:5px}.meter-line{display:grid;grid-template-columns:31px 1fr 53px;gap:5px;align-items:center;font-size:12px;font-weight:800}.bar{height:13px;background:#494949;border-radius:10px;overflow:hidden;border:1px solid #666}.hp,.sp{height:100%;transition:width .2s}.hp{background:linear-gradient(90deg,#49a955,#78d77e)}.sp{background:linear-gradient(90deg,#347ac3,#66b7ff)}
.ult{height:100%;background:linear-gradient(90deg,#bb7b16,#ffd759)}.hud-money{text-align:right;font-size:16px;font-weight:900;color:#ffd969;line-height:1.2}.income{display:block;font-size:10px;color:#8fe69b;margin-top:4px}.buff-line,.passive-line{font-size:9px;color:#ccc;line-height:1.2}
#bottom-zone{min-height:0;display:grid;grid-template-rows:74px 1fr;gap:4px}
#actions{min-height:0;display:grid;align-items:stretch}
.control-ring{height:100%;display:grid;grid-template-columns:1fr 104px 1fr;gap:5px;align-items:center}
.button-stack{display:grid;grid-template-columns:1fr 1fr;gap:5px;height:100%}
button{width:100%;min-height:34px;padding:4px;border-radius:8px;border:1px solid #666;background:linear-gradient(#414141,#303030);color:#fff;font-size:11px;font-weight:800;line-height:1.15}
button:disabled{opacity:.28}.active{background:linear-gradient(#65845e,#42583e)!important;border-color:#91ba86!important}.end-btn{background:linear-gradient(#84443e,#592d29);border-color:#a65e55}.full{grid-column:1/-1}
.ult-orb{width:100px;height:100px;border-radius:50%;padding:7px;display:grid;place-items:center;background:conic-gradient(#ffcf4d calc(var(--ult)*1%),#3d3d3d 0);box-shadow:0 0 13px #ffcf4d33;position:relative}.ult-orb::before{content:"";position:absolute;inset:7px;background:#181818;border-radius:50%;border:1px solid #666}.ult-orb button{position:relative;z-index:1;width:82px;height:82px;border-radius:50%;font-size:10px;background:#272727}.ult-orb strong{display:block;font-size:17px;color:#ffd75f;margin:2px 0}.state{background:#242424;padding:7px;border-radius:7px;font-size:11px;text-align:center}.selection-panel{position:absolute;z-index:50;left:8px;right:8px;top:118px;background:#1d1d1df2;border:1px solid #666;border-radius:12px;padding:10px;box-shadow:0 8px 25px #000}.selection-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{background:#2b2b2b;border-radius:8px;padding:8px;font-size:11px}.choice b{font-size:14px}.choice .row{display:flex;justify-content:space-between;margin:3px 0}
.edge-handle{position:fixed;z-index:70;top:50%;width:34px;height:112px;transform:translateY(-50%);padding:4px 2px;writing-mode:vertical-rl;letter-spacing:1px;border-radius:0 9px 9px 0;background:#303030e8}.edge-handle.log-handle{left:0}.edge-handle.shop-handle{right:0;border-radius:9px 0 0 9px}.drawer{position:fixed;z-index:90;top:0;bottom:0;width:min(82vw,330px);background:#1b1b1bf7;border:1px solid #555;padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));transition:transform .25s ease;box-shadow:0 0 25px #000;display:flex;flex-direction:column}.drawer.left{left:0;transform:translateX(-105%)}.drawer.right{right:0;transform:translateX(105%)}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:17px;margin-bottom:10px}.drawer-head button{width:38px;min-height:34px}.drawer-backdrop{position:fixed;z-index:80;inset:0;background:#0008;display:none}.drawer-backdrop.open{display:block}#log{flex:1;overflow:auto;background:#0f0f0f;padding:8px;border-radius:8px;font-size:12px;line-height:1.45}.shop-grid{display:grid;gap:8px}.shop-note{font-size:11px;color:#aaa;margin-bottom:8px}.ability-details{margin-top:auto;background:#252525;border-radius:8px;padding:8px;font-size:11px;line-height:1.45}.ability-details b{color:#ffd86b}
@media(max-height:760px){:root{--board-size:min(90vw,calc(100dvh - 268px),500px)}#app{grid-template-rows:26px 66px var(--board-size) 1fr}h2{line-height:26px;font-size:14px}.hud{padding:4px 6px}.hud-title{font-size:13px}.bar{height:10px}#bottom-zone{grid-template-rows:62px 1fr}.control-ring{grid-template-columns:1fr 84px 1fr}.ult-orb{width:80px;height:80px}.ult-orb button{width:66px;height:66px;font-size:9px}.ult-orb strong{font-size:14px}.button-stack{gap:3px}button{min-height:28px;font-size:10px}.edge-handle{height:92px}}
@media(orientation:landscape) and (max-height:600px){:root{--board-size:min(58vh,420px)}#app{max-width:100%;grid-template-columns:170px var(--board-size) 1fr;grid-template-rows:28px 70px var(--board-size);justify-content:center}h2{grid-column:1/-1}#opponent-hud{grid-column:2;grid-row:2}#board{grid-column:2;grid-row:3}#bottom-zone{grid-column:3;grid-row:2/4;grid-template-rows:90px 1fr;padding:0 6px}.hud{grid-template-columns:1fr}.hud-bars{gap:3px}.hud-money{text-align:left}#phase{top:92px}.control-ring{grid-template-columns:1fr 90px 1fr}}

#board.shake{animation:shake .22s linear}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,1px)}}
.unit{position:relative;isolation:isolate}.unit.bleeding::before{content:"🩸";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.18);font-size:1.15em;z-index:-1;opacity:.9;pointer-events:none}
.unit.shielded::after{content:"";position:absolute;inset:-5px;border:2px solid #7bdcff;border-radius:50%;box-shadow:0 0 8px #7bdcff,inset 0 0 7px #7bdcff;animation:shield 1s ease-in-out infinite alternate}
@keyframes shield{from{opacity:.5;transform:scale(.96)}to{opacity:1;transform:scale(1.08)}}
.damage-pop{position:absolute;z-index:40;pointer-events:none;font-size:18px;font-weight:900;color:white;text-shadow:0 2px 3px #000,0 0 5px #e44;transform:translate(-50%,-50%);animation:pop .9s ease-out forwards}.damage-pop.heal{color:#66ee7a;text-shadow:0 2px 3px #000,0 0 7px #3c5}.damage-pop.reduced{color:#86dcff;font-size:12px;text-shadow:0 1px 2px #000,0 0 5px #4cf}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}20%{opacity:1;transform:translate(-50%,-55%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-140%) scale(.9)}}
.projectile{position:absolute;z-index:35;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;transform:translate(-50%,-50%);transition:left .22s ease-out,top .22s ease-out;pointer-events:none}
.move-ghost{position:absolute;z-index:34;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;transition:left .3s ease,top .3s ease;pointer-events:none}
.buff-line{font-size:10px;font-weight:700;margin-top:3px}
.passive-line{font-size:10px;font-weight:800;margin-top:4px;padding:3px 4px;border-radius:5px;background:#202020}
.mark-stack{position:absolute;z-index:18;left:50%;top:-7px;transform:translateX(-50%);display:flex;gap:1px;pointer-events:none}
.mark-dot{width:6px;height:6px;border-radius:50%;border:1px solid #fff;background:#b93131;box-shadow:0 0 4px #b93131}

.portrait{display:block;width:100%;height:clamp(110px,28dvh,240px);padding:6px;background:#fff;border:1px solid #777;border-radius:8px;margin-bottom:9px;overflow:hidden;cursor:pointer}
.portrait svg{display:block;width:100%;height:100%;overflow:hidden}
.portrait:focus-visible{outline:3px solid #ffd759;outline-offset:2px}
.choice .row{flex-wrap:wrap;gap:2px}
.selection-panel{max-height:calc(100dvh - 138px);overflow:auto}
@media(max-height:500px){.portrait{height:95px}.selection-panel{top:40px;max-height:calc(100dvh - 50px)}}
</style>
</head>
<body>
<div id="app">
 <h2>⚔️ FTFT · 15×15 턴제 1vs1</h2>
 <div id="phase"></div><div id="opponent-hud"></div><div id="board"></div>
 <div id="bottom-zone"><div id="player-hud"></div><div id="actions"></div></div>
</div>
<button class="edge-handle log-handle">전투 로그</button>
<button class="edge-handle shop-handle">포션 상점</button>
<div id="drawer-backdrop" class="drawer-backdrop" onclick="closeDrawers()"></div>
<aside id="log-drawer" class="drawer left"><div class="drawer-head"><span>📜 전투 로그</span><button onclick="closeDrawers()">×</button></div><div id="log"></div></aside>
<aside id="shop-drawer" class="drawer right"><div class="drawer-head"><span>🧪 포션 상점</span><button onclick="closeDrawers()">×</button></div><div class="shop-note">한 턴에 여러 번 구매할 수 있습니다.</div><div id="shop-actions" class="shop-grid"></div><div id="ability-details" class="ability-details"></div></aside>

}
function aiMoveOptions(u){
 let r=[[u.x,u.y]];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  if((x!==u.x||y!==u.y)&&dist(u,{x,y})<=u.c.move&&!occupied(x,y))r.push([x,y])
 }
 return r
}
function aiScorePos(u,x,y,e){
 let d=Math.abs(x-e.x)+Math.abs(y-e.y),score=0;
 let canAtk=aiCanAttackFrom(u,x,y,e);
 if(u.t==="warrior"){
  if(canAtk)score+=120;
  score-=d*11;
  if(Math.abs(x-e.x)<=1&&Math.abs(y-e.y)<=1)score+=30;
 }else{
  if(canAtk)score+=135;
  let ideal=4;
  score-=Math.abs(d-ideal)*16;
  if(d<=1)score-=75;
  if((x===e.x||y===e.y)&&d<=4)score+=45;
  if(Math.abs(x-e.x)<=2&&Math.abs(y-e.y)<=2)score+=25;
 }
 // Avoid getting trapped by mines/edges a little.
 let freedom=0;
 [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
  let nx=x+dx,ny=y+dy;
  if(nx>=0&&ny>=0&&nx<N&&ny<N&&!occupied(nx,ny))freedom++
 });
 score+=freedom*3;
 return score
}
function aiBestMove(){

 for(let [x,y] of opts){

function aiBuySmart(){

 if(danger){

 }

 }

function aiPlaceMineSmart(){
 let u=U(2),e=U(1),placed=false;
 while(gold[2]>=100&&mines.filter(m=>m.owner===2).length<4){
  let cand=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
   if(occupied(x,y))continue;
   let du=Math.abs(x-u.x)+Math.abs(y-u.y);
   let de=Math.abs(x-e.x)+Math.abs(y-e.y);
   // Prefer safe, inconvenient-to-reach mine positions; no arbitrary 2-cell restriction.
   let edge=Math.min(x,y,N-1-x,N-1-y);
   let sc=de*8-du*1.5-edge*2;
   if(x===e.x||y===e.y)sc-=15;
   cand.push({x,y,sc})
  }
  if(!cand.length)break;
  cand.sort((a,b)=>b.sc-a.sc);
  let q=cand[0];
  mines.push({x:q.x,y:q.y,hp:25,owner:2});gold[2]-=100;
  log("AI · 광산 최우선 설치 ("+mines.filter(m=>m.owner===2).length+"/4)");
  placed=true
 }
 return placed
}
function aiLethalPlan(){

 }
 let dbl=(u.t==="assassin"&&(u.c.doubleSkills||u.c.ult>=100))?2:1;
 if(u.t==="assassin"){
  if(!skills.has(2)&&u.c.sp>=2&&pursuitPrev[2].has(1))damage+=(10+u.c.bonus)*dbl;
  if(!skills.has(1)&&u.c.sp>=2&&Math.abs(e.x-u.x)<=2&&Math.abs(e.y-u.y)<=2)damage+=(10+u.c.bonus)*dbl;
 }else if(!skills.has(2)&&u.c.sp>=5&&(u.x===e.x||u.y===e.y))damage+=40;
 if(!used&&cells(u,"attack").some(a=>a[0]===e.x&&a[1]===e.y))damage+=u.c.atk+(u.c.next||0);
 return damage>=e.c.hp
}

function aiTurn(){
 if(gameMode!=="ai"||turn!==2||setup||choose)return;
 let u=U(2),e=U(1);
 log("🤖 AI 턴");
 aiBuySmart();
 // Income engine is the core strategy: fill mine slots immediately whenever affordable.
 aiPlaceMineSmart();
 render();

 // Transform early if Assassin: permanent double skills is strategically stronger than hoarding.
 if(u.t==="assassin"&&u.c.ult>=100&&!u.c.doubleSkills)ultimate();

 u=U(2);e=U(1);

 // Warrior ult: prioritize lethal; otherwise use at full gauge because it also destroys enemy mines and gives permanent move.
 if(u.t==="warrior"&&u.c.ult>=100&&(e.c.hp<=50||mines.some(m=>m.owner===1)||u.c.move<6))ultimate();

 // Destroy profitable enemy mines aggressively before spending attacks on the hero.
 aiSkillMine();
 aiAttackBestMine();

 // Free skill actions before movement. Pursuit ignores distance, so cash it immediately.
 aiUseS2();
 u=U(2);e=U(1);
 if(e.c.hp<=0)return;
 aiUseS1();
 u=U(2);e=U(1);
 if(e.c.hp<=0)return;

 // If already in attack range, attack before moving; otherwise choose the highest scoring reachable tile.
 if(!aiBasicAttack()){
  let [bx,by]=aiBestMove();
  aiMoveTo(bx,by)
 }

 // Skills can still be used after moving. This is especially important for Assassin's 5x5 S1.
 u=U(2);e=U(1);
 if(e.c.hp>0){
  aiUseS2();
  aiUseS1();
 }

 // If movement was not consumed because best position was current square, use basic attack now.
 u=U(2);e=U(1);
 if(e.c.hp>0)aiBasicAttack();

 // Spend spare economy after combat priorities are secured.
 aiPlaceMineSmart();
 render();
 setTimeout(()=>finishTurn(),750)
}

  document.getElementById("phase").innerHTML=`<span class="turn">🎮 게임 모드 선택</span>`;top.innerHTML="";bottom.innerHTML="";shop.innerHTML="";details.innerHTML="스킬 설명과 포션 상점은 게임 시작 후 표시됩니다.";
  a.innerHTML=`<div class="selection-panel"><div class="state">친구와 번갈아 플레이하거나 AI와 대전할 수 있습니다.</div><div class="selection-grid" style="margin-top:8px"><button onclick="selectMode('pvp')">👥 2인 대전</button><button onclick="selectMode('ai')">🤖 AI 대전</button></div><div class="state" style="margin-top:8px">AI는 사거리·생존·콤보·궁극기·경제를 계산해 행동합니다.</div></div>`;
  return
 }
 if(choose){
  document.getElementById("phase").innerHTML=`<span class="turn">🎭 ${choose}P 캐릭터 선택</span>`;top.innerHTML="";bottom.innerHTML="";shop.innerHTML="";details.innerHTML="캐릭터를 먼저 선택하세요.";
  a.innerHTML=`<div class="selection-panel"><div class="selection-grid">
   <div class="choice">${portrait("warrior")}<b>⚔️ 전사</b><div class="row"><span>HP / 이동 / 공격</span><span>150 / 2 / 25</span></div><div>피해를 줄 때 HP 10 회복</div><button style="margin-top:7px" onclick="chooseCharacter('warrior')">전사 선택</button></div>
   <div class="choice">${portrait("assassin")}<b>🗡️ 암살자</b><div class="row"><span>HP / 이동 / 공격</span><span>100 / 4 / 10</span></div><div>5회 적중 시 적 전체 20 피해</div><button style="margin-top:7px" onclick="chooseCharacter('assassin')">암살자 선택</button></div>
  </div><div class="state" style="margin-top:7px">같은 캐릭터끼리도 대전할 수 있습니다.</div></div>`;
  return
 }
 mines.forEach(m=>{let e=at(m.x,m.y);if(e)e.innerHTML=`<div class="mine">⛏️<br>${m.owner}P<br>HP ${m.hp}</div>`});
 P.forEach(u=>{if(u.x===null)return;let e=at(u.x,u.y),q=document.createElement("div"),bleeding=P.some(a=>a.t==="assassin"&&pursuitPrev[a.p].has(u.p));q.className="unit "+u.t+(u.t==="warrior"&&u.c.shout?" shielded":"")+(bleeding?" bleeding":"");q.textContent=u.t==="warrior"?"전":"암";
 let enemyAssassin=P.find(a=>a.p!==u.p&&a.t==="assassin");
 if(enemyAssassin&&enemyAssassin.c.hits>0){
  let ms=document.createElement("div");ms.className="mark-stack";
  for(let i=0;i<Math.min(4,enemyAssassin.c.hits);i++){let d=document.createElement("span");d.className="mark-dot";ms.appendChild(d)}
  q.appendChild(ms)
 }
 e.appendChild(q)});
 if(!setup){let u=U(turn);if(sel==="move")cells(u,"move").forEach(a=>at(a[0],a[1])?.classList.add("move"));if(sel==="attack")cells(u,"attack").forEach(a=>at(a[0],a[1])?.classList.add("attack"));if(sel==="s1"&&u.t==="assassin")for(let y=Math.max(0,u.y-2);y<=Math.min(14,u.y+2);y++)for(let x=Math.max(0,u.x-2);x<=Math.min(14,u.x+2);x++)at(x,y)?.classList.add("skill");
 if(sel==="s2"&&u.t==="warrior"){for(let i=0;i<N;i++){if(i!==u.x)at(i,u.y)?.classList.add("skill");if(i!==u.y)at(u.x,i)?.classList.add("skill")}}
 if(sel==="s2"&&u.t==="assassin"&&pursuitPrev[u.p].has(E(u.p).p))at(E(u.p).x,E(u.p).y)?.classList.add("skill")}
 const u=U(turn),enemy=E(turn);document.getElementById("phase").innerHTML=setup?`<span class="turn">${setup}P 스폰 위치 선택</span>`:`<span class="turn">🎯 ${turn}P ${u.c.name} 턴</span>`;
 top.innerHTML=hud(enemy,false);bottom.innerHTML=hud(u,!setup);
 if(setup){a.innerHTML=`<div class="state full">빈 칸을 터치해서 ${setup}P의 스폰 위치를 선택하세요.</div>`;shop.innerHTML="";details.innerHTML="배치가 끝나면 스킬 정보가 표시됩니다.";return}
 let ability=abilityData(u),c1=u.t==="warrior"?10:2,c2=u.t==="warrior"?5:2;
 details.innerHTML=`<b>① ${ability.s1[0]}</b><br>${ability.s1[1]}<br><br><b>② ${ability.s2[0]}</b><br>${ability.s2[1]}<br><br><b>🔥 ${ability.ult[0]}</b><br>${ability.ult[1]}`;
 shop.innerHTML=`${btn("⛏️ 광산 · 100G","buyMine();closeDrawers()",gold[turn]<100||mines.filter(m=>m.owner===turn).length>=4,sel==="mine")}${btn("💰 부유 · 150G","buyWealth()",gold[turn]<150)}${btn("❤️ 회복 · 100G","buyHeal()",gold[turn]<100||u.c.hp>=u.c.max)}${btn("🔵 SP +5 · 50G","buySP()",gold[turn]<50||u.c.sp>=u.c.maxsp)}${btn("🔥 궁극기 포션 · 미정","",true)}`;
 if(gameMode==="ai"&&turn===2){a.innerHTML=`<div class="state full">🤖 AI가 행동을 결정하고 있습니다…</div>`;return}
 a.innerHTML=`<div class="control-ring">
  <div class="button-stack">${btn("↔ 이동",`sel='move';render()`,used,sel==="move")}${btn("⚔️ 기본 공격",`sel='attack';render()`,used,sel==="attack")}</div>
  <div class="ult-orb" style="--ult:${u.c.ult}">${btn(`🔥 궁극기<strong>${u.c.ult}%</strong>${ability.ult[0]}`,"ultimate()",u.c.ult<100)}</div>
  <div class="button-stack">${btn(`① ${ability.s1[0]}<br>${c1} SP`,`sel='s1';render()`,skills.has(1)||u.c.sp<c1,sel==="s1")}${btn(`② ${ability.s2[0]}<br>${c2} SP`,`sel='s2';render()`,skills.has(2)||u.c.sp<c2,sel==="s2")}${btn("턴 종료","endTurn()",false,false,"end-btn full")}</div>
 </div>`;
}
render();log("게임 시작 · 게임 모드를 선택하세요.");
